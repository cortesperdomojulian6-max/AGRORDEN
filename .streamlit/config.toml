# Configuración de Streamlit para AGRORDEN
# toolbarMode=minimal oculta el botón "Deploy" y el menú de Streamlit:
# esta app es local y privada; no se ofrece publicación externa.
[client]
toolbarMode = "minimal"

[server]
headless = true

# Identidad visual de campo: verde bosque, crema y tinta.
[theme]
base = "light"
primaryColor = "#2E4B2F"
backgroundColor = "#F6F4EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#24301F"
