# Configuración de Streamlit para AGRORDEN
# toolbarMode=minimal oculta el botón "Deploy" y el menú de Streamlit:
# esta app es local y privada; no se ofrece publicación externa.
[client]
toolbarMode = "minimal"

[server]
headless = true

[theme]
base = "light"
primaryColor = "#22402C"
backgroundColor = "#EFE7D0"
secondaryBackgroundColor = "#FAF6EC"
textColor = "#211C16"
