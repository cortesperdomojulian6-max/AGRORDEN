# Configuración de Streamlit para AGRORDEN
# toolbarMode=minimal oculta el botón "Deploy" y el menú de Streamlit:
# esta app es local y privada; no se ofrece publicación externa.
[client]
toolbarMode = "minimal"

[server]
headless = true

# Identidad visual "Orden del hato" (agrorden-vision.html):
# potrero verde bosque, hueso/pergamino, hierro, paja, tinta cálida.
[theme]
base = "light"
primaryColor = "#B9862E"
backgroundColor = "#E7DCC2"
secondaryBackgroundColor = "#FAF6EC"
textColor = "#211C16"
